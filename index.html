<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VolleyScore</title>
  <style>
    * { box-sizing: border-box; }

    body {
      display: grid;
      grid-template-rows: 1fr 4fr;
      height: 100vh;
      height: 100dvh;
      margin: 0;
      overflow: hidden;
      background: #101218;
      color: #fff;
      font: 1rem system-ui, sans-serif;
    }

    header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      grid-template-areas: "reset countdown clocks" "status status status";
      grid-template-rows: 1fr auto;
      align-items: center;
      column-gap: 0.25rem;
      padding: clamp(0.25rem, 2vmin, 1rem);
    }

    #reset {
      grid-area: reset;
      justify-self: start;
      border: 1px solid currentColor;
      border-radius: 0.35rem;
      padding: 0.25em 0.6em;
      font-size: min(4.5vh, 3.8vw, 2.25rem);
      white-space: nowrap;
    }

    #countdown {
      grid-area: countdown;
      border: 1px solid currentColor;
      border-radius: 0.35rem;
      padding: 0.1em 0.5em;
      font-size: min(7vh, 4.8vw, 2.8rem);
      font-weight: bold;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    #countdown[aria-disabled="true"] { cursor: default; }

    .clocks {
      grid-area: clocks;
      text-align: right;
      font-size: min(4.5vh, 3.8vw, 2.25rem);
      line-height: 1.15;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    #status {
      grid-area: status;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      margin-inline: calc(-1 * clamp(0.25rem, 2vmin, 1rem));
      text-align: center;
      font-weight: bold;
      font-size: min(4.5vh, 4vw, 2.25rem);
      line-height: 1;
    }

    main {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      min-height: 0;
    }

    .side {
      --score-size: min(37.5vw, 34vh);
      --score-width: 1.28;
      --label-size: calc(var(--score-size) / 4);
      position: relative;
      display: grid;
      grid-template: repeat(2, minmax(0, 1fr)) / repeat(2, minmax(0, 1fr));
      overflow: hidden;
    }

    .team-label {
      position: absolute;
      z-index: 1;
      top: calc(50% - var(--score-size) * 0.5 - var(--label-size) * 2.6);
      left: 0;
      right: 0;
      text-align: center;
      pointer-events: none;
      font-weight: bold;
      font-size: var(--label-size);
      line-height: 1.2;
      letter-spacing: 0.12em;
    }

    .red { background: #b00020; }
    .blue { background: #001f54; }

    .score {
      position: absolute;
      top: 50%;
      left: 50%;
      width: calc(var(--score-size) * var(--score-width));
      height: var(--score-size);
      transform: translate(-50%, -50%);
      display: grid;
      place-items: center;
      pointer-events: none;
    }

    .score svg { width: 100%; height: 100%; fill: currentColor; }

    button {
      border: 0;
      background: none;
      color: inherit;
      font: inherit;
      cursor: pointer;
      touch-action: manipulation;
    }

    button:focus-visible {
      outline: 2px solid currentColor;
      outline-offset: -4px;
    }

    .point {
      grid-column: span 2;
      display: grid;
      justify-items: center;
      align-items: end;
      padding: 0 0 calc(var(--score-size) * 0.5 + var(--label-size) * 0.1);
      font-size: var(--label-size);
      line-height: 1.2;
    }

    .point[aria-disabled="true"] { cursor: default; }

    .subtract {
      grid-column: span 2;
      display: grid;
      justify-items: center;
      align-items: start;
      padding: calc(var(--score-size) * 0.5 + var(--label-size) * 0.1) 0 0;
      font-size: var(--label-size);
      line-height: 1.2;
    }
  </style>
</head>
<body>
  <header>
    <button id="reset" type="button">New set</button>
    <button id="countdown" type="button" aria-label="Start countdown: 2:00">2:00</button>
    <div class="clocks">
      <time id="clock" aria-label="Local time"></time>
      <div>Set <span id="set-duration" role="timer" aria-label="Set duration">0:00</span></div>
    </div>
    <div id="status" role="status"><span></span><span></span></div>
  </header>
  <main aria-label="Volleyball scoreboard">
    <section class="side red" aria-label="HOME side">
      <div class="team-label">HOME</div>
      <button class="point" type="button" aria-label="Add one point to HOME">+</button>
      <button class="subtract" type="button" aria-label="Subtract one point from HOME">−</button>
      <output class="score" aria-label="HOME score 00"><svg aria-hidden="true"></svg></output>
    </section>
    <section class="side blue" aria-label="AWAY side">
      <div class="team-label">AWAY</div>
      <button class="point" type="button" aria-label="Add one point to AWAY">+</button>
      <button class="subtract" type="button" aria-label="Subtract one point from AWAY">−</button>
      <output class="score" aria-label="AWAY score 00"><svg aria-hidden="true"></svg></output>
    </section>
  </main>
  <script>
    const scores = [0, 0];
    const teams = ['HOME', 'AWAY'];
    const displays = document.querySelectorAll('.score');
    const addButtons = document.querySelectorAll('.point');
    const winnerLabels = document.querySelectorAll('#status span');
    const clock = document.querySelector('#clock');
    const countdown = document.querySelector('#countdown');
    const setDuration = document.querySelector('#set-duration');
    const countdownSeconds = 120;
    const countdownLength = countdownSeconds * 1000;
    let countdownEndsAt = 0;
    let lastAutomaticEnd = 0;
    let setRunningSince = null;
    let setElapsed = 0;
    const segments = [
      '11,2 49,2 54,7 49,12 11,12 6,7',
      '56,9 60,14 60,41 56,46 51,41 51,14',
      '56,54 60,59 60,86 56,91 51,86 51,59',
      '11,88 49,88 54,93 49,98 11,98 6,93',
      '4,54 9,59 9,86 4,91 0,86 0,59',
      '4,9 9,14 9,41 4,46 0,41 0,14',
      '11,45 49,45 54,50 49,55 11,55 6,50'
    ];
    const digitSegments = [
      '012345', '12', '01643', '01623', '5162',
      '05623', '056234', '012', '0123456', '012356'
    ];
    let winner = -1;

    function renderScore(display, team, score) {
      const text = String(score).padStart(2, '0');
      const svg = display.querySelector('svg');
      const width = text.length * 68 - 8;
      const shapes = [];
      for (const [index, digit] of Array.from(text).entries()) {
        for (const segment of digitSegments[Number(digit)]) {
          const polygon = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
          polygon.setAttribute('points', segments[Number(segment)]);
          polygon.setAttribute('transform', `translate(${index * 68} 0)`);
          shapes.push(polygon);
        }
      }
      svg.setAttribute('viewBox', `0 0 ${width} 100`);
      svg.replaceChildren(...shapes);
      display.setAttribute('aria-label', `${team} score ${text}`);
      display.parentElement.style.setProperty('--score-size', `min(calc(4800vw / ${width}), 34vh)`);
      display.parentElement.style.setProperty('--score-width', width / 100);
    }

    function formatDuration(seconds) {
      return `${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, '0')}`;
    }

    function updateSetDuration(now) {
      const elapsed = setElapsed + (setRunningSince === null ? 0 : now - setRunningSince);
      const text = formatDuration(Math.floor(elapsed / 1000));
      if (setDuration.textContent !== text) setDuration.textContent = text;
    }

    function currentHourEnd(now) {
      return now.getTime() + (60 - now.getMinutes()) * 60_000
        - now.getSeconds() * 1000 - now.getMilliseconds();
    }

    function updateCountdown(now) {
      const time = now.getTime();
      const minutes = now.getMinutes();
      if (minutes >= 58) {
        const hourEnd = currentHourEnd(now);
        if (lastAutomaticEnd !== hourEnd) {
          lastAutomaticEnd = hourEnd;
          // A manual countdown that crossed :58 takes this hour's slot.
          if (countdownEndsAt <= hourEnd - countdownLength) countdownEndsAt = hourEnd;
        }
      }
      const remaining = countdownEndsAt - time;
      const text = countdownEndsAt === 0 ? formatDuration(countdownSeconds)
        : remaining <= 0 ? 'TIMES UP' : formatDuration(Math.ceil(remaining / 1000));
      const canStart = remaining <= 0 && minutes < 58;
      const label = `${canStart ? 'Start countdown' : 'Countdown'}: ${text}`;
      if (countdown.textContent !== text) countdown.textContent = text;
      if (countdown.getAttribute('aria-label') !== label) countdown.setAttribute('aria-label', label);
      if (countdown.getAttribute('aria-disabled') !== String(!canStart)) {
        countdown.setAttribute('aria-disabled', String(!canStart));
      }
    }

    function render(now = performance.now()) {
      const previousWinner = winner;
      winner = scores.findIndex((score, side) => score >= 25 && score - scores[1 - side] >= 2);
      if (winner !== -1 && setRunningSince !== null) {
        setElapsed += now - setRunningSince;
        setRunningSince = null;
      } else if (winner === -1 && previousWinner !== -1) {
        setRunningSince = now;
      }
      updateSetDuration(now);
      scores.forEach((score, side) => {
        renderScore(displays[side], teams[side], score);
        addButtons[side].setAttribute('aria-disabled', String(winner !== -1));
        winnerLabels[side].textContent = winner === side ? 'WINNER' : '';
      });
    }

    addButtons.forEach((button, side) => {
      button.addEventListener('click', () => {
        if (winner !== -1) return;
        const now = performance.now();
        if (setRunningSince === null) setRunningSince = now;
        scores[side]++;
        render(now);
      });
    });

    document.querySelectorAll('.subtract').forEach((button, side) => {
      button.addEventListener('click', () => {
        if (scores[side] === 0) return;
        scores[side]--;
        render();
      });
    });

    document.querySelector('#reset').addEventListener('click', () => {
      scores.fill(0);
      winner = -1;
      setRunningSince = null;
      setElapsed = 0;
      countdownEndsAt = 0;
      const now = new Date();
      if (now.getMinutes() >= 58) lastAutomaticEnd = currentHourEnd(now);
      updateCountdown(now);
      render();
    });

    countdown.addEventListener('click', () => {
      const now = new Date();
      if (now.getMinutes() < 58 && now.getTime() >= countdownEndsAt) {
        countdownEndsAt = now.getTime() + countdownLength;
      }
      updateCountdown(now);
    });

    const timeFormat = new Intl.DateTimeFormat(undefined, { timeStyle: 'medium' });
    function updateClocks() {
      const now = new Date();
      const text = timeFormat.format(now);
      if (clock.textContent !== text) clock.textContent = text;
      updateCountdown(now);
      updateSetDuration(performance.now());
    }
    updateClocks();
    setInterval(updateClocks, 250);
    render();
  </script>
</body>
</html>
