<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VolleyScore</title>
  <style>
    * { box-sizing: border-box; }

    body {
      display: grid;
      grid-template-rows: 1fr 4fr;
      height: 100vh;
      height: 100dvh;
      margin: 0;
      overflow: hidden;
      background: #101218;
      color: #fff;
      font: 1rem system-ui, sans-serif;
    }

    header {
      display: grid;
      grid-template-columns: auto 1fr auto;
      grid-template-areas: "reset . clock" "status status status";
      align-items: start;
      padding: clamp(0.25rem, 2vmin, 1rem);
    }

    #reset {
      grid-area: reset;
      border: 1px solid currentColor;
      border-radius: 0.35rem;
      padding: 0.25em 0.6em;
    }

    #clock {
      grid-area: clock;
      font-variant-numeric: tabular-nums;
    }

    #status {
      grid-area: status;
      text-align: center;
      font-weight: bold;
    }

    main {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      min-height: 0;
    }

    .side {
      --score-size: min(37.5vw, 34vh);
      --score-width: 1.28;
      --label-size: calc(var(--score-size) / 4);
      position: relative;
      display: grid;
      grid-template: repeat(2, minmax(0, 1fr)) / repeat(2, minmax(0, 1fr));
      overflow: hidden;
    }

    .team-label {
      position: absolute;
      z-index: 1;
      top: calc(50% - var(--score-size) * 0.5 - var(--label-size) * 2.6);
      left: 0;
      right: 0;
      text-align: center;
      pointer-events: none;
      font-weight: bold;
      font-size: var(--label-size);
      line-height: 1.2;
      letter-spacing: 0.12em;
    }

    .red { background: #b00020; }
    .blue { background: #001f54; }

    .score {
      position: absolute;
      top: 50%;
      left: 50%;
      width: calc(var(--score-size) * var(--score-width));
      height: var(--score-size);
      transform: translate(-50%, -50%);
      display: grid;
      place-items: center;
      pointer-events: none;
    }

    .score svg { width: 100%; height: 100%; fill: currentColor; }

    button {
      border: 0;
      background: none;
      color: inherit;
      font: inherit;
      cursor: pointer;
      touch-action: manipulation;
    }

    button:focus-visible {
      outline: 2px solid currentColor;
      outline-offset: -4px;
    }

    .point {
      grid-column: span 2;
      display: grid;
      justify-items: center;
      align-items: end;
      padding: 0 0 calc(var(--score-size) * 0.5 + var(--label-size) * 0.1);
      font-size: var(--label-size);
      line-height: 1.2;
    }

    .point[aria-disabled="true"] { cursor: default; }

    .subtract {
      grid-column: span 2;
      display: grid;
      justify-items: center;
      align-items: start;
      padding: calc(var(--score-size) * 0.5 + var(--label-size) * 0.1) 0 0;
      font-size: var(--label-size);
      line-height: 1.2;
    }
  </style>
</head>
<body>
  <header>
    <button id="reset" type="button">New set</button>
    <time id="clock" aria-label="Local time"></time>
    <div id="status" role="status"></div>
  </header>
  <main aria-label="Volleyball scoreboard">
    <section class="side red" aria-label="HOME side">
      <div class="team-label">HOME</div>
      <button class="point" type="button" aria-label="Add one point to HOME">+</button>
      <button class="subtract" type="button" aria-label="Subtract one point from HOME">−</button>
      <output class="score" aria-label="HOME score 00"><svg aria-hidden="true"></svg></output>
    </section>
    <section class="side blue" aria-label="AWAY side">
      <div class="team-label">AWAY</div>
      <button class="point" type="button" aria-label="Add one point to AWAY">+</button>
      <button class="subtract" type="button" aria-label="Subtract one point from AWAY">−</button>
      <output class="score" aria-label="AWAY score 00"><svg aria-hidden="true"></svg></output>
    </section>
  </main>
  <script>
    const scores = [0, 0];
    const teams = ['HOME', 'AWAY'];
    const displays = document.querySelectorAll('.score');
    const addButtons = document.querySelectorAll('.point');
    const status = document.querySelector('#status');
    const clock = document.querySelector('#clock');
    const segments = [
      '11,2 49,2 54,7 49,12 11,12 6,7',
      '56,9 60,14 60,41 56,46 51,41 51,14',
      '56,54 60,59 60,86 56,91 51,86 51,59',
      '11,88 49,88 54,93 49,98 11,98 6,93',
      '4,54 9,59 9,86 4,91 0,86 0,59',
      '4,9 9,14 9,41 4,46 0,41 0,14',
      '11,45 49,45 54,50 49,55 11,55 6,50'
    ];
    const digitSegments = [
      '012345', '12', '01643', '01623', '5162',
      '05623', '056234', '012', '0123456', '012356'
    ];
    let winner = -1;

    function renderScore(display, team, score) {
      const text = String(score).padStart(2, '0');
      const svg = display.querySelector('svg');
      const width = text.length * 68 - 8;
      const shapes = [];
      for (const [index, digit] of Array.from(text).entries()) {
        for (const segment of digitSegments[Number(digit)]) {
          const polygon = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
          polygon.setAttribute('points', segments[Number(segment)]);
          polygon.setAttribute('transform', `translate(${index * 68} 0)`);
          shapes.push(polygon);
        }
      }
      svg.setAttribute('viewBox', `0 0 ${width} 100`);
      svg.replaceChildren(...shapes);
      display.setAttribute('aria-label', `${team} score ${text}`);
      display.parentElement.style.setProperty('--score-size', `min(calc(4800vw / ${width}), 34vh)`);
      display.parentElement.style.setProperty('--score-width', width / 100);
    }

    function render() {
      winner = scores.findIndex((score, side) => score >= 25 && score - scores[1 - side] >= 2);
      scores.forEach((score, side) => {
        renderScore(displays[side], teams[side], score);
        addButtons[side].setAttribute('aria-disabled', String(winner !== -1));
      });
      status.textContent = winner === -1 ? '' : `${teams[winner]} wins the set`;
    }

    addButtons.forEach((button, side) => {
      button.addEventListener('click', () => {
        if (winner !== -1) return;
        scores[side]++;
        render();
      });
    });

    document.querySelectorAll('.subtract').forEach((button, side) => {
      button.addEventListener('click', () => {
        if (scores[side] === 0) return;
        scores[side]--;
        render();
      });
    });

    document.querySelector('#reset').addEventListener('click', () => {
      scores.fill(0);
      render();
    });

    const timeFormat = new Intl.DateTimeFormat(undefined, { timeStyle: 'medium' });
    const updateClock = () => { clock.textContent = timeFormat.format(new Date()); };
    updateClock();
    setInterval(updateClock, 1000);
    render();
  </script>
</body>
</html>
