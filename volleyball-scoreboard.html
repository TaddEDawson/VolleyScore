<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10151f">
<title>Volleyball Scoreboard</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:#10151f;color:#fff;font-family:system-ui,Arial,sans-serif;user-select:none;-webkit-user-select:none}header{height:20%;padding:clamp(8px,2vh,24px) clamp(12px,3vw,40px);display:flex;flex-direction:column;justify-content:space-between;gap:4px}.top,.bottom{display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:clamp(14px,2.3vw,28px);margin:0;letter-spacing:.04em}time{font-size:clamp(18px,3vw,38px);font-variant-numeric:tabular-nums;white-space:nowrap}.tools{display:flex;gap:8px}.tools button{color:#fff;background:#242e3d;border:1px solid #6b7789;border-radius:8px;padding:8px 12px;font:inherit;font-size:clamp(11px,1.4vw,16px);cursor:pointer}#status{font-size:clamp(12px,1.8vw,22px);font-weight:650}.hint{margin:0;color:#ced5df;font-size:clamp(10px,1.2vw,15px)}main{height:80%;display:grid;grid-template-columns:1fr 1fr}.side{position:relative;overflow:hidden;display:grid;place-items:center;isolation:isolate}.red{background:#800000}.blue{background:#001b4d}.side+.side{border-left:2px solid #ffffff80}.score{font-family:Arial,Helvetica,sans-serif;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.06em;padding-right:.06em;line-height:1;font-size:min(42vw,65vh);pointer-events:none}.label{position:absolute;top:2%;left:0;right:0;text-align:center;letter-spacing:.18em;font-size:clamp(12px,1.7vw,22px);pointer-events:none}.zone{position:absolute;border:0;border-radius:0;background:transparent;color:#fff;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.plus{top:0;left:0;width:100%;height:50%}.minus{bottom:0;left:0;width:100%;height:50%;border-top:1px solid #ffffff40}.symbol{position:absolute;font-size:clamp(16px,2.4vw,30px);opacity:.8}.plus .symbol{top:12%;right:6%}.minus .symbol{bottom:10%;left:5.4%}.zone:active{background:#ffffff20}button:focus-visible{outline:4px solid #ffdb4d;outline-offset:-5px}.winner{box-shadow:inset 0 0 0 6px #ffdb4d}.zone:disabled{cursor:default}.plus:disabled .symbol{opacity:.25}dialog{color:#fff;background:#182231;border:1px solid #8290a5;border-radius:14px;max-width:90vw;padding:24px}dialog::backdrop{background:#000b}dialog button{padding:12px 18px;margin-right:8px;font:inherit;border-radius:6px;border:0;cursor:pointer}@media(max-height:420px){header{padding:5px 12px}.hint{display:none}.tools button{padding:4px 8px}.score{font-size:min(42vw,65vh)}}
</style>
</head>
<body>
<header>
 <div class="top"><h1>VOLLEYBALL <span style="font-weight:400">/ SCOREBOARD</span></h1><time id="clock" aria-label="Current local time"></time></div>
 <div class="bottom"><div id="status" role="status" aria-live="polite">First to 25 · Win by 2</div><div class="tools"><button id="fullscreen" type="button">Full screen</button><button id="reset" type="button">New set</button></div></div>
 <p class="hint">Tap the upper half for +1 · Tap the lower half for −1</p>
</header>
<main aria-label="Set scores">
 <section class="side red" aria-label="Left team"><div class="label">LEFT</div><div class="score" id="left-score">00</div><button class="zone plus" data-team="0" data-change="1" aria-label="Add one point to left team"><span class="symbol" aria-hidden="true">+</span></button><button class="zone minus" data-team="0" data-change="-1" aria-label="Subtract one point from left team"><span class="symbol" aria-hidden="true">−1</span></button></section>
 <section class="side blue" aria-label="Right team"><div class="label">RIGHT</div><div class="score" id="right-score">00</div><button class="zone plus" data-team="1" data-change="1" aria-label="Add one point to right team"><span class="symbol" aria-hidden="true">+</span></button><button class="zone minus" data-team="1" data-change="-1" aria-label="Subtract one point from right team"><span class="symbol" aria-hidden="true">−1</span></button></section>
</main>
<dialog id="reset-dialog" aria-labelledby="reset-title"><h2 id="reset-title">Start a new set?</h2><p>Both scores will return to 00.</p><form method="dialog"><button value="cancel" autofocus>Cancel</button><button value="reset">Start new set</button></form></dialog>
<script>
'use strict';
// Everything is embedded: no network, fonts, libraries, or server required.
let scores = [0, 0];
function winnerOf(values) {
 if (Math.max(...values) >= 25 && Math.abs(values[0] - values[1]) >= 2) return values[0] > values[1] ? 0 : 1;
 return -1;
}
function changeScore(team, delta) {
 if (delta > 0 && winnerOf(scores) !== -1) return;
 scores[team] = Math.max(0, scores[team] + delta);
 render();
}
function render() {
 const winner = winnerOf(scores);
 document.querySelectorAll('.side').forEach((side, index) => {
  const score = side.querySelector('.score');
  score.textContent = String(scores[index]).padStart(2, '0');
  score.style.fontSize = scores[index] >= 100 ? 'min(28vw, 55vh)' : '';
  side.classList.toggle('winner', winner === index);
  side.querySelector('.plus').disabled = winner !== -1;
 });
 document.getElementById('status').textContent = winner !== -1
  ? `${winner === 0 ? 'Left' : 'Right'} wins the set · ${scores[0]}–${scores[1]}`
  : Math.min(...scores) >= 24 ? 'Win by 2 · Play continues' : 'First to 25 · Win by 2';
}
document.querySelectorAll('.zone').forEach(button => button.addEventListener('click', () => changeScore(Number(button.dataset.team), Number(button.dataset.change))));
const resetDialog = document.getElementById('reset-dialog');
document.getElementById('reset').addEventListener('click', () => resetDialog.showModal());
resetDialog.addEventListener('close', () => { if (resetDialog.returnValue === 'reset') { scores = [0, 0]; render(); } });
document.getElementById('fullscreen').addEventListener('click', async () => {
 try { if (document.fullscreenElement) await document.exitFullscreen(); else await document.documentElement.requestFullscreen(); }
 catch { document.getElementById('fullscreen').textContent = 'Use browser full screen'; }
});
document.addEventListener('fullscreenchange', () => { document.getElementById('fullscreen').textContent = document.fullscreenElement ? 'Exit full screen' : 'Full screen'; });
function updateClock() { const now = new Date(); const clock = document.getElementById('clock'); clock.textContent = now.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'}); clock.dateTime = now.toISOString(); }
updateClock(); setInterval(updateClock, 1000); render();
</script>
</body>
</html>
